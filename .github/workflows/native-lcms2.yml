name: Native Little CMS runtime

on:
  pull_request:
    paths:
      - '.github/workflows/native-lcms2.yml'
      - 'eng/native/lcms2/**'
      - 'Fovium/ColorManagement/**'
      - 'Fovium/Fovium.csproj'
      - 'Fovium/Rendering/SkiaPhotoDrawOperation.cs'
      - 'Fovium/Viewer/PhotoViewportControl.cs'
      - 'Fovium/Views/ViewerWindow.axaml.cs'
      - 'Fovium.Tests/ColorManagement/**'
      - 'Fovium.Tests/Fovium.Tests.csproj'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/native-lcms2.yml'
      - 'eng/native/lcms2/**'
      - 'Fovium/ColorManagement/**'
      - 'Fovium/Fovium.csproj'
      - 'Fovium/Rendering/SkiaPhotoDrawOperation.cs'
      - 'Fovium/Viewer/PhotoViewportControl.cs'
      - 'Fovium/Views/ViewerWindow.axaml.cs'
      - 'Fovium.Tests/ColorManagement/**'
      - 'Fovium.Tests/Fovium.Tests.csproj'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package-smoke:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify host architecture
        shell: pwsh
        run: |
          $expected = '${{ matrix.rid }}'
          $actual = [System.Runtime.InteropServices.RuntimeInformation]::RuntimeIdentifier
          Write-Host "Expected RID: $expected"
          Write-Host "Actual RID:   $actual"
          if ($actual -ne $expected) {
              throw 'Hosted runner architecture mismatch.'
          }

      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake python3

      - name: Build, package, audit, and smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh eng/native/lcms2/build.ps1 -Rid win-x64

      - name: Build, package, audit, and smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash eng/native/lcms2/build.sh '${{ matrix.rid }}'

      - name: Validate generated manifest and evidence
        shell: pwsh
        run: |
          $bundle = Join-Path '${{ github.workspace }}' 'artifacts/native/fovium-lcms2-${{ matrix.rid }}'
          $manifestPath = Join-Path $bundle 'manifest.json'
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          if ($manifest.rid -ne '${{ matrix.rid }}' -or $manifest.version -ne '2.19') {
              throw 'Generated manifest identity is invalid.'
          }
          if ($manifest.smoke.result -ne 'PASS' -or $manifest.smoke.iterations -ne 100 -or $manifest.smoke.failures -ne 0) {
              throw 'Generated smoke evidence is incomplete.'
          }
          if ($manifest.smoke.buildPrefixAvailable -ne $false) {
              throw 'Build prefix was available during smoke.'
          }
          foreach ($entry in $manifest.runtimeFiles | Where-Object type -eq 'file') {
              $path = Join-Path $bundle "$($manifest.runtimeDirectory)/$($entry.path)"
              $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualHash -ne $entry.sha256) {
                  throw "Runtime hash mismatch: $path"
              }
          }
          $loaded = [IO.Path]::GetFullPath($manifest.smoke.runtimePath)
          $runtimeRoot = [IO.Path]::GetFullPath((Join-Path $bundle $manifest.runtimeDirectory))
          if (-not $loaded.StartsWith($runtimeRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Smoke loaded a non-artifact runtime: $loaded"
          }
          Get-Content -LiteralPath (Join-Path $bundle 'evidence/smoke-report.txt')

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore product
        run: dotnet restore Fovium.sln

      - name: Build product with materialized runtime
        run: dotnet build Fovium.sln -c Release --no-restore

      - name: Verify app-local Little CMS materialization
        shell: pwsh
        run: |
          $bundle = Join-Path '${{ github.workspace }}' 'artifacts/native/fovium-lcms2-${{ matrix.rid }}'
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $bundle 'manifest.json') | ConvertFrom-Json
          $output = Join-Path '${{ github.workspace }}' 'Fovium/bin/Release/net10.0/runtimes/${{ matrix.rid }}/native'
          foreach ($entry in $manifest.runtimeFiles | Where-Object type -eq 'file') {
              $path = Join-Path $output $entry.path
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Fovium Little CMS runtime was not materialized at $path"
              }
              $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualHash -ne $entry.sha256) {
                  throw "Materialized Little CMS runtime hash mismatch: $path"
              }
          }

      - name: Test production Little CMS interop
        env:
          FOVIUM_REQUIRE_LCMS_TEST_RUNTIME: '1'
        run: >-
          dotnet test Fovium.Tests/Fovium.Tests.csproj -c Release --no-build
          --filter "FullyQualifiedName~Fovium.Tests.ColorManagement.LittleCmsProductionInteropTests"

      - name: Upload native runtime artifact
        uses: actions/upload-artifact@v6
        with:
          name: fovium-lcms2-${{ matrix.rid }}
          if-no-files-found: error
          path: |
            artifacts/native/packages/fovium-lcms2-${{ matrix.rid }}.*
